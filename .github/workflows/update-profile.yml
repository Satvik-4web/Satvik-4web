name: Update Production Stats

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'theme.config.json'

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Production Stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-stats.mjs

      - name: Commit changes if production stats changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-stats*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh production stats"
            git push origin master
          else
            echo "No telemetry changes detected. Skipping commit."
          fi
