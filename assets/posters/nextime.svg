.62 L365.95 110.63 C365.95 113.76 365.41 114.35 362.12 114.35 C361.90 114.35 361.90 115.00 362.12 115.00" fill="url(#goldGrad)"/>
    <text class="serif-tagline" x="60" y="152">
      "The student operating system where the daily timetable orchestrates every academic action."
    </text>
  </g>

  <!-- Cinema Scene Still: Gold Line Timetable + Gauges (60, 180 to 1140, 500) -->
  <g transform="translate(60, 180)">
    <!-- Still Container Frame -->
    <rect width="1080" height="320" fill="#0D0D0D" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1"/>

    <!-- Still Frame Corner Accents -->
    <path d="M 0 16 L 0 0 L 16 0" fill="none" stroke="#C8A15B" stroke-width="1.2"/>
    <path d="M 1080 16 L 1080 0 L 1064 0" fill="none" stroke="#C8A15B" stroke-width="1.2"/>
    <path d="M 0 304 L 0 320 L 16 320" fill="none" stroke="#C8A15B" stroke-width="1.2"/>
    <path d="M 1080 304 L 1080 320 L 1064 320" fill="none" stroke="#C8A15B" stroke-width="1.2"/>

    <!-- Sub-heading inside Scene Still -->
    <text class="sans-track" x="24" y="32" font-size="9" fill="#C8A15B">SCENE STILL 01 &#8226; DAY CYCLE TIMELINE</text>
    <text class="sans-track" x="1056" y="32" font-size="8.5" fill="#5A544A" text-anchor="end">45/10 POMODORO &#8226; CGPA FORECAST</text>

    <!-- Timetable Section (Left: width 620) -->
    <g transform="translate(24, 60)">
      <line x1="0" y1="0" x2="600" y2="0" stroke="rgba(200, 161, 91, 0.15)" stroke-dasharray="3 3"/>
      <line x1="0" y1="120" x2="600" y2="120" stroke="rgba(200, 161, 91, 0.15)" stroke-dasharray="3 3"/>

      <!-- Slot 1: 09:00 MATH -->
      <g transform="translate(0, 20)">
        <rect width="110" height="70" fill="none" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1"/>
        <text class="sans-track" x="55" y="28" font-size="8.5" fill="#5A544A" text-anchor="middle">09:00</text>
        <text class="sans-track" x="55" y="48" font-size="10" font-weight="600" fill="#8C8577" text-anchor="middle">MATH-201</text>
      </g>

      <!-- Slot 2: 10:30 CS-304 (ACTIVE) -->
      <g transform="translate(130, 20)">
        <rect class="active-slot" width="160" height="70" fill="none" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1.2"/>
        <text class="sans-track" x="80" y="28" font-size="8.5" fill="#5A544A" text-anchor="middle">10:30 &#8226; LIVE</text>
        <text class="sans-track" x="80" y="48" font-size="11" font-weight="600" fill="#C8A15B" text-anchor="middle">CS-304 OS</text>
        
        <!-- Status indicator tag above -->
        <g transform="translate(80, -10)">
          <text class="sans-track tag-next" x="0" y="0" font-size="8" fill="#5A544A" text-anchor="middle">NEXT</text>
          <text class="sans-track tag-now"  x="0" y="0" font-size="8.5" font-weight="600" fill="#E8D3A2" text-anchor="middle">&#9670; NOW &#9670;</text>
          <text class="sans-track tag-done" x="0" y="0" font-size="8" fill="#8C8577" text-anchor="middle">&#10003; DONE</text>
        </g>
      </g>

      <!-- Slot 3: 12:00 FREE -->
      <g transform="translate(310, 20)">
        <rect width="120" height="70" fill="none" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1" stroke-dasharray="2 2"/>
        <text class="sans-track" x="60" y="28" font-size="8.5" fill="#5A544A" text-anchor="middle">12:00</text>
        <text class="sans-track" x="60" y="48" font-size="9.5" fill="#C8A15B" text-anchor="middle">FREE SLOT</text>
      </g>

      <!-- Slot 4: 13:30 AI LAB -->
      <g transform="translate(450, 20)">
        <rect width="140" height="70" fill="none" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1"/>
        <text class="sans-track" x="70" y="28" font-size="8.5" fill="#5A544A" text-anchor="middle">13:30</text>
        <text class="sans-track" x="70" y="48" font-size="10" font-weight="600" fill="#8C8577" text-anchor="middle">AI LAB</text>
      </g>

      <!-- Sweeping Gold Hairline Scanner -->
      <g class="scan-line" transform="translate(10, 10)">
        <line x1="0" y1="0" x2="0" y2="90" stroke="#C8A15B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="2.5" fill="#E8D3A2"/>
        <circle cx="0" cy="90" r="2.5" fill="#E8D3A2"/>
      </g>
    </g>

    <!-- Still Timeline Lower Telemetry -->
    <text class="sans-track" x="24" y="210" font-size="9" fill="#5A544A">FEATURE: REALTIME ATTENDANCE THRESHOLD (&gt;80% SAFE &#8226; &lt;75% CRITICAL) &#8226; REALTIME FRIEND MESH</text>

    <!-- Right Side Gauges: Attendance Ring & Pomodoro Arc (x=720 to 1040) -->
    <!-- Gauge 1: Attendance Ring -->
    <g transform="translate(770, 140)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(200, 161, 91, 0.15)" stroke-width="3"/>
      <circle class="ring-fill" cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" transform="rotate(-90)"/>
      <text class="sans-track" x="0" y="6" font-size="14" font-weight="600" fill="#C8A15B" text-anchor="middle">86%</text>
      <text class="sans-track" x="0" y="60" font-size="8.5" fill="#8C8577" text-anchor="middle">ATTENDANCE</text>
      <text class="sans-track" x="0" y="74" font-size="7.5" fill="#C8A15B" text-anchor="middle">SAFE TIER</text>
    </g>

    <!-- Divider between gauges -->
    <line x1="880" y1="80" x2="880" y2="240" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Gauge 2: Pomodoro Arc -->
    <g transform="translate(980, 140)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(200, 161, 91, 0.15)" stroke-width="3"/>
      <circle class="arc-focus" cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" transform="rotate(-90)"/>
      <text class="sans-track" x="0" y="6" font-size="13" font-weight="600" fill="#EDE6D8" text-anchor="middle">45:00</text>
      <text class="sans-track" x="0" y="60" font-size="8.5" fill="#8C8577" text-anchor="middle">POMODORO</text>
      <text class="sans-track" x="0" y="74" font-size="7.5" fill="#5A544A" text-anchor="middle">45 / 10 / 20</text>
    </g>
  </g>

  <!-- Cinema Credit Block (Bottom) -->
  <g transform="translate(60, 545)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1"/>
    
    <g transform="translate(0, 30)">
      <text class="sans-track" x="0" y="0" font-size="9" fill="#5A544A">EXECUTIVE PRODUCER</text>
      <text class="sans-track" x="0" y="18" font-size="11" font-weight="600" fill="#EDE6D8">SATVIK</text>
    </g>

    <g transform="translate(240, 30)">
      <text class="sans-track" x="0" y="0" font-size="9" fill="#5A544A">TECHNICAL ARCHITECTURE</text>
      <text class="sans-track" x="0" y="18" font-size="11" font-weight="600" fill="#C8A15B">NEXT.JS 14 &#8226; TYPESCRIPT &#8226; SUPABASE REALTIME &#8226; TAILWIND &#8226; REDIS</text>
    </g>

    <g transform="translate(900, 30)">
      <text class="sans-track" x="180" y="0" font-size="9" fill="#5A544A" text-anchor="end">DISTRIBUTION</text>
      <text class="sans-track" x="180" y="18" font-size="11" font-weight="600" fill="#EDE6D8" text-anchor="end">VERCEL PWA</text>
    </g>

    <!-- Bottom link hint -->
    <text class="sans-track" x="540" y="80" font-size="9.5" fill="#C8A15B" text-anchor="middle">
      VIEW SOURCE &#8226; GITHUB.COM/SATVIK-4WEB/NEXTIME &#8226; LIVE DEMO IN RELEASE &#8599;
    </text>
  </g>
</svg>