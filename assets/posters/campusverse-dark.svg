    <rect x="940" y="-12" width="140" height="20" fill="none" stroke="rgba(200, 161, 91, 0.4)" stroke-width="1"/>
    <text class="sans-track" x="1010" y="2" font-size="9" font-weight="600" fill="#C8A15B" text-anchor="middle">&#9670; FEATURED SYSTEM</text>
