    <text class="sans-track" x="1056" y="32" font-size="8.5" fill="#5A544A" text-anchor="end">TIET ELC GRANT &#8226; 6-DOF ANCHOR</text>

    <!-- Isometric Wireframe Kiosk (Centered at x=540, y=160) -->
    <g transform="translate(300, 30)">
      <!-- Isometric Ground Grid -->
      <path d="M 80 200 L 240 140 L 400 200 L 240 260 Z" fill="none" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1"/>
      <path d="M 160 170 L 320 230 M 320 170 L 160 230" stroke="rgba(200, 161, 91, 0.15)" stroke-width="0.8" stroke-dasharray="2 2"/>

      <!-- Kiosk Core Prism -->
      <!-- Vertical lines -->
      <line x1="200" y1="190" x2="200" y2="90" stroke="#C8A15B" stroke-width="1.4"/>
      <line x1="240" y1="205" x2="240" y2="105" stroke="#C8A15B" stroke-width="1.4"/>
      <line x1="280" y1="190" x2="280" y2="90" stroke="#C8A15B" stroke-width="1.4"/>
      <line x1="240" y1="175" x2="240" y2="75" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- Front screen face -->
      <polygon points="200,90 240,105 240,65 200,50" fill="rgba(200, 161, 91, 0.15)" stroke="#C8A15B" stroke-width="1.2"/>
      <!-- Right face -->
      <polygon points="240,105 280,90 280,50 240,65" fill="none" stroke="#C8A15B" stroke-width="1.2"/>
      <!-- Top face -->
      <polygon points="200,50 240,35 280,50 240,65" fill="#141414" stroke="#C8A15B" stroke-width="1.2"/>

      <!-- Ambient Architectural Pavilion Framework -->
      <line x1="140" y1="160" x2="140" y2="70" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1"/>
      <line x1="340" y1="160" x2="340" y2="70" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1"/>
      <line x1="140" y1="70" x2="240" y2="20" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="340" y1="70" x2="240" y2="20" stroke="rgba(200, 161, 91, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Rotating AR Reticle Corners (Targeting Kiosk) -->
      <g class="ar-frame">
        <path d="M 160 50 L 160 30 L 180 30" fill="none" stroke="#C8A15B" stroke-width="2"/>
        <path d="M 300 30 L 320 30 L 320 50" fill="none" stroke="#C8A15B" stroke-width="2"/>
        <path d="M 160 170 L 160 190 L 180 190" fill="none" stroke="#C8A15B" stroke-width="2"/>
        <path d="M 300 190 L 320 190 L 320 170" fill="none" stroke="#C8A15B" stroke-width="2"/>
        <!-- Central crosshairs -->
        <circle cx="240" cy="110" r="3" fill="#C8A15B"/>
        <line x1="230" y1="110" x2="250" y2="110" stroke="#C8A15B" stroke-width="1"/>
        <line x1="240" y1="100" x2="240" y2="120" stroke="#C8A15B" stroke-width="1"/>
      </g>

      <!-- Laser Scan Sweep -->
      <g class="laser-sweep" transform="translate(140, 30)">
        <line x1="0" y1="0" x2="200" y2="0" stroke="#E8D3A2" stroke-width="1.8"/>
      </g>
    </g>

    <!-- Telemetry Readout Details (Bottom Left & Right inside still) -->
    <g transform="translate(24, 255)">
      <text class="sans-track" x="0" y="0" font-size="9" fill="#5A544A">HARDWARE &#8226; DIGITAL KIOSK TERMINAL</text>
      <text class="sans-track" x="0" y="16" font-size="9.5" font-weight="600" fill="#EDE6D8">PATIALA CAMPUS COORDINATES: 30.3564&#176; N, 76.3647&#176; E</text>
    </g>

    <g transform="translate(1056, 255)">
