90.04 318.51 C1083.22 318.51 1081.23 318.02 1065.11 295.08 L1046.76 270.28 L1060.77 256.02 C1068.21 248.70 1078.13 243.99 1085.70 243.99 C1086.19 243.99 1086.19 242.50 1085.70 242.50 C1081.36 242.50 1077.51 242.87 1069.58 242.87 C1061.89 242.87 1058.05 242.50 1053.58 242.50 C1053.09 242.50 1053.09 243.99 1053.58 243.99 C1061.77 243.99 1063.63 249.20 1057.55 255.27 L1034.24 279.08 L1034.24 252.79 C1034.24 245.72 1035.60 243.99 1043.04 243.99 C1043.54 243.99 1043.54 242.50 1043.04 242.50 C1038.83 242.50 1033.49 242.87 1027.29 242.87 C1021.34 242.87 1016.01 242.50 1011.67 242.50 C1011.17 242.50 1011.17 243.99 1011.67 243.99 C1019.11 243.99 1020.47 245.48 1020.47 252.54" fill="url(#goldGrad)"/>
    </g>

    <!-- Horizontal Hairline Under Title -->
    <line class="draw-line" x1="420" y1="360" x2="1180" y2="360" stroke="rgba(200, 161, 91, 0.4)" stroke-width="1"/>

    <!-- Subtitle: A FILM ABOUT BUILDING THINGS -->
    <text class="sans-track fade-sub" x="800" y="405" font-size="12" fill="#8C8577" text-anchor="middle">A FILM ABOUT BUILDING THINGS</text>

    <!-- Lower Third: 4 Cycling Title Cards (Calm Cross-Fades) -->
    <g transform="translate(800, 520)">
      <!-- Card 1: BUILD -->
      <g class="card-1">
        <text class="sans-track" x="0" y="0" font-size="13" font-weight="600" fill="#C8A15B" text-anchor="middle">&#9670; I. BUILD &#9670;</text>
        <text class="sans-track" x="0" y="24" font-size="9" fill="#5A544A" text-anchor="middle">THE FIRST DRAFT OF EVERY SYSTEM</text>
      </g>

      <!-- Card 2: BREAK -->
      <g class="card-2" opacity="0">
        <text class="sans-track" x="0" y="0" font-size="13" font-weight="600" fill="#C8A15B" text-anchor="middle">&#9670; II. BREAK &#9670;</text>
        <text class="sans-track" x="0" y="24" font-size="9" fill="#5A544A" text-anchor="middle">STRESS-TESTING AT THE PERIMETER</text>
      </g>

      <!-- Card 3: LEARN -->
      <g class="card-3" opacity="0">
        <text class="sans-track" x="0" y="0" font-size="13" font-weight="600" fill="#C8A15B" text-anchor="middle">&#9670; III. LEARN &#9670;</text>
        <text class="sans-track" x="0" y="24" font-size="9" fill="#5A544A" text-anchor="middle">ANALYSIS OF FAILURE &amp; ARCHITECTURE</text>
      </g>

      <!-- Card 4: REBUILD -->
      <g class="card-4" opacity="0">
        <text class="sans-track" x="0" y="0" font-size="13" font-weight="600" fill="#C8A15B" text-anchor="middle">&#9670; IV. REBUILD &#9670;</text>
        <text class="sans-track" x="0" y="24" font-size="9" fill="#5A544A" text-anchor="middle">PRODUCTION-GRADE INTELLIGENCE</text>
      </g>
    </g>
  </g>

  <!-- Anamorphic Lens Flare Sweep -->
  <g class="flare-streak" transform="translate(0, 340)">
    <ellipse cx="0" cy="0" rx="340" ry="1.2" fill="url(#flareGrad)"/>
    <circle cx="0" cy="0" r="3" fill="rgba(232, 211, 162, 0.85)" opacity="0.7"/>
  </g>
</svg>