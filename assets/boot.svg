<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <linearGradient id="bootProgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="bootGlow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0, 0, 0, 0.45)"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .line-1 { animation: fadeIn 0.2s ease-out 0.1s both; }
      .line-2 { animation: fadeIn 0.2s ease-out 0.3s both; }
      .line-3 { animation: fadeIn 0.2s ease-out 0.5s both; }
      .line-4 { animation: fadeIn 0.2s ease-out 0.7s both; }
      .prog-track { animation: fadeIn 0.2s ease-out 0.9s both; }
      .prog-fill { animation: fillBar 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
      .line-welcome { animation: fadeIn 0.3s ease-out 1.5s both; }
      .line-prompt { animation: fadeIn 0.3s ease-out 1.7s both; }
      .cursor { animation: blink 0.9s step-end 1.7s infinite; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fillBar {
      from { width: 0px; }
      to   { width: 440px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
  </style>

  <!-- Window Container -->
  <rect x="8" y="8" width="784" height="234" rx="12" fill="#11161D" stroke="#1F293B" stroke-width="1" filter="url(#bootGlow)"/>

  <!-- Title Bar -->
  <path d="M 8 20 A 12 12 0 0 1 20 8 L 780 8 A 12 12 0 0 1 792 20 L 792 42 L 8 42 Z" fill="#0E131B" stroke="#1F293B" stroke-width="1"/>
  <circle cx="28" cy="25" r="5" fill="#FF5F56"/>
  <circle cx="44" cy="25" r="5" fill="#FFBD2E"/>
  <circle cx="60" cy="25" r="5" fill="#27C93F"/>
  
  <text x="80" y="29" class="mono" font-size="12" fill="#64748B" letter-spacing="0.5">satvik-os -- boot sequence -- v1.0.4-LTS (x86_64)</text>
  <rect x="682" y="17" width="94" height="16" rx="4" fill="rgba(79, 140, 255, 0.08)"/>
  <text x="729" y="29" class="mono" font-size="10" font-weight="600" fill="#22D3EE" text-anchor="middle">UEFI SECURE</text>

  <!-- Terminal Content Lines -->

  <!-- Line 1 -->
  <g class="line-1" transform="translate(28, 68)">
    <text class="mono" font-size="12" fill="#64748B">[ 0.000000 ]</text>
    <text x="96" class="mono" font-size="12" fill="#94A3B8">Linux satvik-os 6.12.0-satvik-lts x86_64</text>
  </g>

  <!-- Line 2 -->
  <g class="line-2" transform="translate(28, 92)">
    <text class="mono" font-size="12" fill="#64748B">[ 0.142091 ]</text>
    <text x="96" class="mono" font-size="12" fill="#94A3B8">init: core CPU and memory subsystem</text>
    <text x="490" class="mono" font-size="12" font-weight="600" fill="#10B981">[  OK  ]</text>
  </g>

  <!-- Line 3 -->
  <g class="line-3" transform="translate(28, 116)">
    <text class="mono" font-size="12" fill="#64748B">[ 0.318492 ]</text>
    <text x="96" class="mono" font-size="12" fill="#94A3B8">auth: Satvik-4web (TIET Patiala '28)</text>
    <text x="490" class="mono" font-size="12" font-weight="600" fill="#10B981">[  OK  ]</text>
  </g>

  <!-- Line 4 -->
  <g class="line-4" transform="translate(28, 140)">
    <text class="mono" font-size="12" fill="#64748B">[ 0.490182 ]</text>
    <text x="96" class="mono" font-size="12" fill="#94A3B8">mount: /dev/fullstack-ai-workspace</text>
    <text x="490" class="mono" font-size="12" font-weight="600" fill="#10B981">[  OK  ]</text>
  </g>

  <!-- Progress Bar Line -->
  <g class="prog-track" transform="translate(28, 166)">
    <text class="mono" font-size="12" fill="#64748B">[  BOOT  ]</text>
    <!-- Track -->
    <rect x="96" y="-11" width="440" height="12" rx="3" fill="#0E131B" stroke="#1F293B" stroke-width="1"/>
    <!-- Fill bar -->
    <rect class="prog-fill" x="96" y="-11" width="440" height="12" rx="3" fill="url(#bootProgGrad)"/>
    <text x="550" class="mono" font-size="12" font-weight="600" fill="#22D3EE">100%</text>
  </g>

  <!-- Welcome Line -->
  <g class="line-welcome" transform="translate(28, 196)">
    <text class="mono" font-size="13" font-weight="600" fill="#22D3EE">welcome, visitor.</text>
    <text x="145" class="mono" font-size="13" fill="#94A3B8">satvik-os interactive session active.</text>
  </g>

  <!-- Prompt Line and Blinking Cursor -->
  <g class="line-prompt" transform="translate(28, 222)">
    <text class="mono" font-size="12" fill="#10B981">visitor@satvik-os</text>
    <text x="124" class="mono" font-size="12" fill="#64748B">:</text>
    <text x="134" class="mono" font-size="12" fill="#4F8CFF">~</text>
    <text x="144" class="mono" font-size="12" fill="#94A3B8">$ explore ./processes</text>
    <rect class="cursor" x="306" y="-11" width="8" height="14" fill="#22D3EE"/>
  </g>
</svg>