<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="290">
  <defs>
    <linearGradient id="monAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="monShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0, 0, 0, 0.08)"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: no-preference) {
      .bar-fill {
        animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .pulse-dot {
        animation: pulseLight 3s ease-in-out infinite;
      }
    }
    @keyframes growBar {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes pulseLight {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 1; filter: drop-shadow(0 0 4px #059669); }
    }
  </style>

  <!-- Window Container -->
  <rect x="8" y="8" width="784" height="274" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#monShadow)"/>

  <!-- Title Bar -->
  <path d="M 8 20 A 12 12 0 0 1 20 8 L 780 8 A 12 12 0 0 1 792 20 L 792 44 L 8 44 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="28" cy="26" r="5" fill="#FF5F56"/>
  <circle cx="44" cy="26" r="5" fill="#FFBD2E"/>
  <circle cx="60" cy="26" r="5" fill="#27C93F"/>
  
  <text x="80" y="30" class="mono" font-size="12" fill="#94A3B8">sysmon://telemetry [PID 0001] — github-actions nightly sync</text>
  
  <!-- Right status tag -->
  <g transform="translate(670, 16)">
    <rect width="102" height="20" rx="10" fill="rgba(37, 99, 235, 0.08)" stroke="#E2E8F0" stroke-width="1"/>
    <circle class="pulse-dot" cx="12" cy="10" r="3" fill="#059669"/>
    <text x="56" y="14" class="mono" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">SYNCED</text>
  </g>

  <!-- Left Column: KPI Cards -->
  <g transform="translate(28, 58)">
    <!-- KPI 1: Public Repos -->
    <g transform="translate(0, 0)">
      <rect width="320" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="24" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.5">PUBLIC REPOSITORIES</text>
      <text x="16" y="50" class="mono" font-size="22" font-weight="700" fill="#0891B2">17</text>
      <text x="70" y="50" class="mono" font-size="10.5" fill="#475569">verified repositories</text>
    </g>

    <!-- KPI 2: Commits in last 30 days -->
    <g transform="translate(0, 72)">
      <rect width="320" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="24" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.5">COMMITS (LAST 30 DAYS)</text>
      <text x="16" y="50" class="mono" font-size="22" font-weight="700" fill="#059669">16</text>
      <text x="70" y="50" class="mono" font-size="10.5" fill="#475569">pushed across branches</text>
    </g>

    <!-- KPI 3: Last Pushed Repo -->
    <g transform="translate(0, 144)">
      <rect width="320" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="24" class="mono" font-size="9.5" fill="#94A3B8" letter-spacing="0.5">LATEST PUSHED REPO</text>
      <text x="16" y="50" class="mono" font-size="14" font-weight="700" fill="#0F172A">Satvik-4web</text>
      <text x="304" y="50" class="mono" font-size="10" fill="#0891B2" text-anchor="end">today</text>
    </g>
  </g>

  <!-- Right Column: Languages by Bytes -->
  <g transform="translate(366, 58)">
    <rect width="406" height="208" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Panel Header -->
    <text x="16" y="24" class="mono" font-size="10" font-weight="700" fill="#0F172A" letter-spacing="0.5">LANGUAGES BY BYTES</text>
    <text x="390" y="24" class="mono" font-size="9" fill="#94A3B8" text-anchor="end">GITHUB API SCAN</text>

    <!-- Segmented Multi-Bar -->
    <g transform="translate(14, 34)">
      <rect width="378" height="10" rx="5" fill="#F1F5F9"/>
      
      <rect x="0.0" y="0" width="105.5" height="10" fill="#3572A5" rx="2"/>
      
      <rect x="105.5" y="0" width="99.4" height="10" fill="#3178C6" rx="2"/>
      
      <rect x="204.9" y="0" width="69.9" height="10" fill="#F1E05A" rx="2"/>
      
      <rect x="274.8" y="0" width="40.1" height="10" fill="#178600" rx="2"/>
      
      <rect x="314.9" y="0" width="18.9" height="10" fill="#8B5CF6" rx="2"/>
      
      <rect x="333.8" y="0" width="44.2" height="10" fill="#8B5CF6" rx="2"/>
      
    </g>

    <!-- Language Breakdown Rows -->
    <g transform="translate(14, 60)">
      
      <!-- Row 0: Python -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="11" r="3.5" fill="#3572A5"/>
        <text x="18" y="14" class="mono" font-size="10" font-weight="600" fill="#0F172A">Python</text>
        
        <!-- Individual mini bar -->
        <rect x="110" y="6" width="160" height="7" rx="3.5" fill="#F1F5F9"/>
        <rect class="bar-fill" style="transform-origin: 110px 0px;" x="110" y="6" width="44.6" height="7" rx="3.5" fill="#3572A5"/>
        
        <text x="282" y="14" class="mono" font-size="9" fill="#94A3B8">846 KB</text>
        <text x="374" y="14" class="mono" font-size="10" font-weight="700" fill="#0891B2" text-anchor="end">27.9%</text>
      </g>
      <!-- Row 1: TypeScript -->
      <g transform="translate(0, 22)">
        <circle cx="6" cy="11" r="3.5" fill="#3178C6"/>
        <text x="18" y="14" class="mono" font-size="10" font-weight="600" fill="#0F172A">TypeScript</text>
        
        <!-- Individual mini bar -->
        <rect x="110" y="6" width="160" height="7" rx="3.5" fill="#F1F5F9"/>
        <rect class="bar-fill" style="transform-origin: 110px 0px;" x="110" y="6" width="42.1" height="7" rx="3.5" fill="#3178C6"/>
        
        <text x="282" y="14" class="mono" font-size="9" fill="#94A3B8">798 KB</text>
        <text x="374" y="14" class="mono" font-size="10" font-weight="700" fill="#0891B2" text-anchor="end">26.3%</text>
      </g>
      <!-- Row 2: JavaScript -->
      <g transform="translate(0, 44)">
        <circle cx="6" cy="11" r="3.5" fill="#F1E05A"/>
        <text x="18" y="14" class="mono" font-size="10" font-weight="600" fill="#0F172A">JavaScript</text>
        
        <!-- Individual mini bar -->
        <rect x="110" y="6" width="160" height="7" rx="3.5" fill="#F1F5F9"/>
        <rect class="bar-fill" style="transform-origin: 110px 0px;" x="110" y="6" width="29.6" height="7" rx="3.5" fill="#F1E05A"/>
        
        <text x="282" y="14" class="mono" font-size="9" fill="#94A3B8">561 KB</text>
        <text x="374" y="14" class="mono" font-size="10" font-weight="700" fill="#0891B2" text-anchor="end">18.5%</text>
      </g>
      <!-- Row 3: C# -->
      <g transform="translate(0, 66)">
        <circle cx="6" cy="11" r="3.5" fill="#178600"/>
        <text x="18" y="14" class="mono" font-size="10" font-weight="600" fill="#0F172A">C#</text>
        
        <!-- Individual mini bar -->
        <rect x="110" y="6" width="160" height="7" rx="3.5" fill="#F1F5F9"/>
        <rect class="bar-fill" style="transform-origin: 110px 0px;" x="110" y="6" width="17.0" height="7" rx="3.5" fill="#178600"/>
        
        <text x="282" y="14" class="mono" font-size="9" fill="#94A3B8">322 KB</text>
        <text x="374" y="14" class="mono" font-size="10" font-weight="700" fill="#0891B2" text-anchor="end">10.6%</text>
      </g>
      <!-- Row 4: PHP/Blade -->
      <g transform="translate(0, 88)">
        <circle cx="6" cy="11" r="3.5" fill="#8B5CF6"/>
        <text x="18" y="14" class="mono" font-size="10" font-weight="600" fill="#0F172A">PHP/Blade</text>
        
        <!-- Individual mini bar -->
        <rect x="110" y="6" width="160" height="7" rx="3.5" fill="#F1F5F9"/>
        <rect class="bar-fill" style="transform-origin: 110px 0px;" x="110" y="6" width="8.0" height="7" rx="3.5" fill="#8B5CF6"/>
        
        <text x="282" y="14" class="mono" font-size="9" fill="#94A3B8">150 KB</text>
        <text x="374" y="14" class="mono" font-size="10" font-weight="700" fill="#0891B2" text-anchor="end">5%</text>
      </g>
      <!-- Row 5: Other -->
      <g transform="translate(0, 110)">
        <circle cx="6" cy="11" r="3.5" fill="#8B5CF6"/>
        <text x="18" y="14" class="mono" font-size="10" font-weight="600" fill="#0F172A">Other</text>
        
        <!-- Individual mini bar -->
        <rect x="110" y="6" width="160" height="7" rx="3.5" fill="#F1F5F9"/>
        <rect class="bar-fill" style="transform-origin: 110px 0px;" x="110" y="6" width="18.7" height="7" rx="3.5" fill="#8B5CF6"/>
        
        <text x="282" y="14" class="mono" font-size="9" fill="#94A3B8">355 KB</text>
        <text x="374" y="14" class="mono" font-size="10" font-weight="700" fill="#0891B2" text-anchor="end">11.7%</text>
      </g>
    </g>
  </g>
</svg>