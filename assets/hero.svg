<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background-color: #0d1117;
          border: 1px solid #30363d;
          border-radius: 8px;
          height: 198px;
          width: 798px;
          font-family: 'Courier New', Courier, monospace;
          color: #c9d1d9;
          overflow: hidden;
          box-sizing: border-box;
        }
        .header {
          background-color: #161b22;
          border-bottom: 1px solid #30363d;
          padding: 8px 16px;
          display: flex;
          align-items: center;
        }
        .dots {
          display: flex;
          gap: 6px;
        }
        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }
        .title {
          margin-left: 20px;
          font-size: 12px;
          color: #8b949e;
        }
        .body {
          padding: 20px;
        }
        .prompt { color: #2ea043; font-weight: bold; }
        .command { color: #58a6ff; }
        .output { color: #c9d1d9; margin-top: 5px; margin-bottom: 15px; }
        .cursor { display: inline-block; width: 8px; height: 15px; background-color: #c9d1d9; animation: blink 1s step-end infinite; vertical-align: middle;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      </style>
      <div class="container">
        <div class="header">
          <div class="dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div class="title">satvik@github:~ - bash</div>
        </div>
        <div class="body">
          <div><span class="prompt">satvik@github:~$</span> <span class="command">whoami</span></div>
          <div class="output">Satvik</div>
          <div><span class="prompt">satvik@github:~$</span> <span class="command">cat role.txt</span></div>
          <div class="output">Software Engineer | AI/ML Engineer in Progress</div>
          <div><span class="prompt">satvik@github:~$</span> <span class="command">status --current</span></div>
          <div class="output" style="color: #58a6ff;">● ONLINE — BUILDING AI SYSTEMS<span class="cursor"></span></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
