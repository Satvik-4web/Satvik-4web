<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="360">
  <defs>
    <linearGradient id="wmAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="wmShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0, 0, 0, 0.08)"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: no-preference) {
      /* Invalid packet that bounces back */
      .packet-invalid {
        animation: packetBounce 8s ease-in-out infinite;
      }
      /* Valid packet that commits */
      .packet-valid {
        animation: packetCommit 8s ease-in-out infinite;
      }
      /* Trigger node state */
      .trigger-box {
        animation: triggerCycle 8s ease-in-out infinite;
      }
      /* Banner state switch */
      .banner-rejected { animation: showRejected 8s step-end infinite; }
      .banner-commit   { animation: showCommit 8s step-end infinite; }
    }
    @keyframes packetBounce {
      0%   { transform: translate(0px, 0px); opacity: 0; }
      5%   { opacity: 1; }
      22%  { transform: translate(110px, 0px); }
      35%  { transform: translate(40px, 0px); opacity: 1; }
      45%  { transform: translate(40px, 0px); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes packetCommit {
      0%, 48% { opacity: 0; transform: translate(0px, 0px); }
      50%     { opacity: 1; }
      68%     { transform: translate(110px, 0px); }
      85%     { transform: translate(220px, 0px); opacity: 1; }
      95%     { transform: translate(220px, 0px); opacity: 0; }
      100%    { opacity: 0; }
    }
    @keyframes triggerCycle {
      0%, 15%  { stroke: #E2E8F0; fill: #F1F5F9; }
      20%, 42% { stroke: #DC2626; fill: rgba(220, 38, 38, 0.12); }
      48%, 62% { stroke: #E2E8F0; fill: #F1F5F9; }
      68%, 90% { stroke: #059669; fill: rgba(5, 150, 105, 0.12); }
      100%     { stroke: #E2E8F0; fill: #F1F5F9; }
    }
    @keyframes showRejected {
      0%, 48%   { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes showCommit {
      0%, 48%   { opacity: 0; }
      49%, 100% { opacity: 1; }
    }
  </style>

  <!-- Window Container -->
  <rect x="8" y="8" width="784" height="344" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#wmShadow)"/>

  <!-- Title Bar -->
  <path d="M 8 20 A 12 12 0 0 1 20 8 L 780 8 A 12 12 0 0 1 792 20 L 792 44 L 8 44 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="28" cy="26" r="5" fill="#FF5F56"/>
  <circle cx="44" cy="26" r="5" fill="#FFBD2E"/>
  <circle cx="60" cy="26" r="5" fill="#27C93F"/>
  
  <text x="80" y="30" class="mono" font-size="12" fill="#94A3B8">proc://oracle-plsql [PID 1152] — Satvik-4web/dbms-project</text>
  
  <!-- Status Badge BUILT -->
  <rect x="696" y="16" width="82" height="20" rx="10" fill="rgba(37, 99, 235, 0.12)" stroke="#2563EB" stroke-width="1"/>
  <circle cx="710" cy="26" r="3.5" fill="#2563EB"/>
  <text x="742" y="30" class="mono" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">BUILT</text>

  <!-- Left Column: Description and Highlights -->
  <g transform="translate(28, 64)">
    <text class="mono" font-size="19" font-weight="700" fill="#0F172A">Waste Management</text>
    <text x="236" y="-2" class="mono" font-size="11" font-weight="600" fill="#059669">"DBMS Engine"</text>

    <!-- One-line Description -->
    <text y="28" class="mono" font-size="11" fill="#475569">
      <tspan x="0" dy="0">Oracle PL/SQL normalized relational system with automated</tspan>
      <tspan x="0" dy="16">triggers, cursors, procedures, and ACID transaction safety.</tspan>
    </text>

    <!-- Key Capabilities List -->
    <g transform="translate(0, 72)">
      <text class="mono" font-size="10.5" fill="#059669">▸</text>
      <text x="16" class="mono" font-size="10.5" fill="#0F172A">Schema normalized to 3NF &amp; BCNF relations</text>

      <text y="20" class="mono" font-size="10.5" fill="#0891B2">▸</text>
      <text x="16" y="20" class="mono" font-size="10.5" fill="#0F172A">PL/SQL triggers: quantity &amp; vehicle-capacity constraints</text>

      <text y="40" class="mono" font-size="10.5" fill="#DC2626">▸</text>
      <text x="16" y="40" class="mono" font-size="10.5" fill="#0F172A">ACID integrity: automated ROLLBACK on constraint break</text>

      <text y="60" class="mono" font-size="10.5" fill="#7C3AED">▸</text>
      <text x="16" y="60" class="mono" font-size="10.5" fill="#0F172A">Includes ER diagrams, schema scripts &amp; Express API</text>
    </g>

    <!-- Tech Tags Row -->
    <g transform="translate(0, 162)">
      <rect width="68" height="20" rx="4" fill="#E2E8F0" stroke="#E2E8F0" stroke-width="1"/>
      <text x="34" y="14" class="mono" font-size="10" fill="#1E40AF" text-anchor="middle">Oracle</text>

      <rect x="74" width="76" height="20" rx="4" fill="#E2E8F0" stroke="#E2E8F0" stroke-width="1"/>
      <text x="112" y="14" class="mono" font-size="10" fill="#1E40AF" text-anchor="middle">PL/SQL</text>

      <rect x="156" width="72" height="20" rx="4" fill="#E2E8F0" stroke="#E2E8F0" stroke-width="1"/>
      <text x="192" y="14" class="mono" font-size="10" fill="#1E40AF" text-anchor="middle">Node.js</text>

      <rect x="234" width="72" height="20" rx="4" fill="#E2E8F0" stroke="#E2E8F0" stroke-width="1"/>
      <text x="270" y="14" class="mono" font-size="10" fill="#1E40AF" text-anchor="middle">3NF/BCNF</text>

      <rect x="312" width="46" height="20" rx="4" fill="#E2E8F0" stroke="#E2E8F0" stroke-width="1"/>
      <text x="335" y="14" class="mono" font-size="10" fill="#1E40AF" text-anchor="middle">ACID</text>
    </g>

    <!-- Footer CLI Link hint -->
    <g transform="translate(0, 204)">
      <rect width="350" height="26" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="17" class="mono" font-size="10" fill="#94A3B8">$ gh repo view Satvik-4web/dbms-project</text>
      <text x="340" y="17" class="mono" font-size="10" font-weight="700" fill="#059669" text-anchor="end">SCHEMA ↗</text>
    </g>
  </g>

  <!-- Right Column: Micro-Visual (ER Graph + Trigger Node + Reject/Commit Bounce) -->
  <g transform="translate(404, 58)">
    <rect width="372" height="280" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Header bar -->
    <rect x="12" y="12" width="348" height="24" rx="4" fill="#F1F5F9"/>
    <text x="22" y="28" class="mono" font-size="10" font-weight="600" fill="#475569">TRANSACTION MONITOR · ORACLE 3NF</text>
    <text x="350" y="28" class="mono" font-size="9.5" fill="#059669" text-anchor="end">TRIGGERS: ON</text>

    <!-- ER Relational Diagram Nodes -->
    <!-- Connecting ER lines -->
    <line x1="72" y1="80" x2="186" y2="80" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="186" y1="80" x2="300" y2="80" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="186" y1="80" x2="186" y2="135" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Node 1: Household (Left) -->
    <g transform="translate(20, 58)">
      <rect width="90" height="44" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="45" y="20" class="mono" font-size="8.5" fill="#94A3B8" text-anchor="middle">ENTITY</text>
      <text x="45" y="34" class="mono" font-size="9" font-weight="700" fill="#0F172A" text-anchor="middle">HOUSEHOLD</text>
    </g>

    <!-- Node 2: Collection (Center) -->
    <g transform="translate(141, 58)">
      <rect width="90" height="44" rx="5" fill="#F1F5F9" stroke="#0891B2" stroke-width="1"/>
      <text x="45" y="20" class="mono" font-size="8.5" fill="#94A3B8" text-anchor="middle">RELATION</text>
      <text x="45" y="34" class="mono" font-size="9" font-weight="700" fill="#0891B2" text-anchor="middle">COLLECTION</text>
    </g>

    <!-- Node 3: Vehicle (Right) -->
    <g transform="translate(262, 58)">
      <rect width="90" height="44" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="45" y="20" class="mono" font-size="8.5" fill="#94A3B8" text-anchor="middle">CAPACITY</text>
      <text x="45" y="34" class="mono" font-size="9" font-weight="700" fill="#0F172A" text-anchor="middle">VEHICLE</text>
    </g>

    <!-- Trigger Node (Below Collection) -->
    <g class="trigger-box" transform="translate(116, 135)">
      <rect width="140" height="34" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="70" y="16" class="mono" font-size="8.5" font-weight="700" fill="#0F172A" text-anchor="middle">TRIGGER: CHECK_CAP</text>
      <text x="70" y="28" class="mono" font-size="7.5" fill="#94A3B8" text-anchor="middle">PL/SQL BEFORE INSERT</text>
    </g>

    <!-- Invalid packet (Phase 1: 0s-4s) -->
    <g class="packet-invalid" transform="translate(74, 80)">
      <circle cx="0" cy="0" r="5" fill="#DC2626"/>
      <text x="0" y="-8" class="mono" font-size="7.5" font-weight="700" fill="#DC2626" text-anchor="middle">140kg &gt; CAP</text>
    </g>

    <!-- Valid packet (Phase 2: 4s-8s) -->
    <g class="packet-valid" transform="translate(74, 80)">
      <circle cx="0" cy="0" r="5" fill="#059669"/>
      <text x="0" y="-8" class="mono" font-size="7.5" font-weight="700" fill="#059669" text-anchor="middle">35kg OK</text>
    </g>

    <!-- Dynamic Status Banner (Bottom) -->
    <g transform="translate(14, 190)">
      <rect width="344" height="76" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Banner Rejected (shows when capacity exceeded) -->
      <g class="banner-rejected">
        <rect x="0" y="0" width="344" height="24" rx="6" fill="rgba(220, 38, 38, 0.1)"/>
        <text x="12" y="16" class="mono" font-size="9" font-weight="700" fill="#DC2626">TRIGGER EXCEPTION: CAPACITY EXCEEDED</text>
        <text x="332" y="16" class="mono" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="end">ROLLBACK 400</text>
        
        <text x="12" y="42" class="mono" font-size="9" fill="#475569">ORA-20001: Collection payload exceeds vehicle cap</text>
        <text x="12" y="58" class="mono" font-size="8.5" fill="#94A3B8">Status: Transaction aborted · Data integrity preserved</text>
      </g>

      <!-- Banner Commit (shows when valid) -->
      <g class="banner-commit">
        <rect x="0" y="0" width="344" height="24" rx="6" fill="rgba(5, 150, 105, 0.1)"/>
        <text x="12" y="16" class="mono" font-size="9" font-weight="700" fill="#059669">TRIGGER VALIDATION PASSED: CAPACITY OK</text>
        <text x="332" y="16" class="mono" font-size="8.5" font-weight="700" fill="#059669" text-anchor="end">COMMIT 200</text>
        
        <text x="12" y="42" class="mono" font-size="9" fill="#475569">INSERT INTO collection VALUES (...) · ACID VALIDATED</text>
        <text x="12" y="58" class="mono" font-size="8.5" fill="#94A3B8">Status: 3NF/BCNF relations committed to Oracle storage</text>
      </g>
    </g>
  </g>
</svg>